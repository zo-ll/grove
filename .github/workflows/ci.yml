name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --workspace --all-features

      - name: crate boundaries
        run: ./scripts/check-boundaries.sh

      - name: shellcheck every script
        # Every one, not the boundary script by name: the install script is
        # the first thing a new user runs, and a shell bug there is a worse
        # first impression than any test failure.
        run: shellcheck scripts/*.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: build on the pinned MSRV
        # --all-features so feature-gated code is compile-checked against the
        # MSRV too, --locked so the lockfile cannot drift silently in CI.
        run: cargo build --workspace --all-features --locked
