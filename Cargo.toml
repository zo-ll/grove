[workspace]
resolver = "3"
members = [
    "crates/grove-domain",
    "crates/grove-proto",
    "crates/grove-lua",
    "crates/grove-git",
    "crates/grove-state",
    "crates/grove-fakedaemon",
    "crates/grove-cli",
    "crates/groved",
    "crates/grove",
]

[workspace.package]
edition = "2024"
# Raised from 1.85 (the edition-2024 floor) because ratatui 0.30 requires
# 1.88, and 0.30 is not optional: 0.29 pins unicode-width "=0.2.0" while
# groved's vt100 needs ^0.2.1, so the two crates SPEC §8 names cannot coexist
# on the older release.
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/zo-ll/grove"

[workspace.dependencies]
grove-domain = { path = "crates/grove-domain" }
grove-proto = { path = "crates/grove-proto" }
grove-lua = { path = "crates/grove-lua" }
grove-git = { path = "crates/grove-git" }
grove-state = { path = "crates/grove-state" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
todo = "warn"
dbg_macro = "warn"
