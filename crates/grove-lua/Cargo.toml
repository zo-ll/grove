[package]
name = "grove-lua"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
mlua = { version = "0.11", features = ["lua54", "vendored", "send"] }
# For `killpg` alone: the group signal that closes pipes held by a hook's
# background jobs. Not `libc`, because the workspace forbids `unsafe`.
nix = { version = "0.28", features = ["signal"] }
